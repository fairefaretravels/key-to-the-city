<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>DETROIT: WOODWARD AVE<title>

<!-- SEO -->
<meta name="description" content="WOODWARD: DETROIT — Chapter 01: The First Drive. Cruise Detroit, discover landmarks, and play its music scene." />

<!-- Open Graph / social preview (placeholder image — swap for final art later) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="WOODWARD: DETROIT — Chapter 01" />
<meta property="og:description" content="Cruise Detroit, discover landmarks, and play its music scene." />
<meta property="og:image" content="assets/seo/thestatic.PNG" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="WOODWARD: DETROIT — Chapter 01" />
<meta name="twitter:description" content="Cruise Detroit, discover landmarks, and play its underground music scene." />
<meta name="twitter:image" content="assets/seo/thestatic.PNG" />

<link rel="stylesheet" href="style.css" />
<style>
  .radio-panel-v2 {
    background: linear-gradient(160deg, #14171c, #0d1117);
    border: 1px solid #d9a44144;
    border-radius: 14px;
    box-shadow: 0 0 24px #d9a44122, inset 0 0 40px #00000066;
  }
  .radio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .radio-header h2 { margin: 0; letter-spacing: 1px; }
  .radio-mute-btn {
    background: #1a1c1f;
    border: 1px solid #d9a44166;
    color: #d9a441;
    border-radius: 999px;
    padding: 6px 14px;
    font: 700 11px/1 monospace;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .radio-mute-btn.muted {
    background: #3a1616;
    border-color: #ff5533aa;
    color: #ff5533;
  }
  .radio-dial {
    background: #0a0d13;
    border: 1px solid #ffffff14;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .radio-station-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .radio-live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff5533;
    box-shadow: 0 0 8px #ff5533;
    animation: radio-pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes radio-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .radio-station-name {
    font: 800 15px/1.2 monospace;
    letter-spacing: 0.5px;
    color: #f2e9d8;
  }
  .radio-now-playing {
    font: 13px/1.4 monospace;
    color: #d9a441;
    margin-bottom: 4px;
  }
  .radio-status {
    font: 11px/1.4 monospace;
    color: #8a8f98;
  }
  .radio-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .radio-btn {
    flex: 1;
    background: #1a1c1f;
    border: 1px solid #ffffff22;
    color: #f2e9d8;
    border-radius: 8px;
    padding: 10px;
    font: 700 12px/1 monospace;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .radio-btn-primary {
    background: #d9a441;
    color: #14171c;
    border-color: #d9a441;
  }
</style>
</head>
<body>

  <!-- ======================= GAME CANVAS ======================= -->
  <canvas id="game-canvas"></canvas>

  <!-- ======================= ROTATE DEVICE HINT ======================= -->
  <div id="rotate-hint" class="overlay hidden">
    <div class="rotate-icon">⤵</div>
    <p>For the best experience, rotate your device to landscape.</p>
  </div>

  <!-- ======================= HUD (top bar) ======================= -->
  <div id="hud">
    <div id="hud-title">
      <span class="chapter" id="hud-chapter">CHAPTER 01</span>
      <span class="city-name" id="hud-city-name">DETROIT: WOODWARD</span>
    </div>
    <div class="hud-right">
      <div id="credits-chip">★ <span id="credits-count">0</span></div>
      <div id="coins-chip">🪙 <span id="coins-count">0</span></div>
      <button id="garage-toggle" aria-label="Open garage">🚗</button>
      <button id="map-toggle" aria-label="Open map select">🗺</button>
      <button id="progress-toggle" aria-label="Show progress">DETROIT</button>
    </div>
  </div>

  <!-- ======================= PROGRESS PANEL ======================= -->
  <div id="progress-panel" class="panel hidden">
    <h2>PROGRESS</h2>
    <ul id="progress-list"><!-- populated by ProgressManager --></ul>
    <button class="close-btn" data-close="progress-panel">CLOSE</button>
  </div>

  <!-- ======================= CITY SELECT ======================= -->
  <div id="city-select-overlay" class="overlay hidden">
    <div class="discovery-panel city-select-panel">
      <div class="discovery-kicker">CHOOSE YOUR MAP</div>
      <h1>THE MOTOR CITY TOUR</h1>
      <div id="city-select-list"><!-- populated by CityProgression --></div>
      <button class="close-btn" data-close="city-select-overlay">CLOSE</button>
    </div>
  </div>

  <!-- ======================= GARAGE / CUSTOMIZATION ======================= -->
  <div id="garage-overlay" class="overlay hidden">
    <div class="discovery-panel garage-panel">
      <div class="discovery-kicker">GARAGE</div>
      <h1>CUSTOMIZE YOUR RIDE</h1>

      <div class="garage-section">
        <div class="garage-label">VEHICLE TYPE</div>
        <div id="vehicle-type-list" class="chip-row"><!-- populated by Garage --></div>
      </div>

      <div class="garage-section">
        <div class="garage-label">PAINT</div>
        <div id="vehicle-color-list" class="chip-row"><!-- populated by Garage --></div>
      </div>

      <div class="garage-section">
        <div class="garage-label">LICENSE PLATE</div>
        <div class="plate-row">
          <div id="plate-preview" class="plate-preview">DETROIT</div>
          <input id="plate-input" maxlength="8" placeholder="8 CHARS MAX" autocomplete="off" />
        </div>
      </div>

      <button id="garage-save-btn" class="primary-btn">SAVE & CLOSE</button>
    </div>
  </div>

  <!-- ======================= TOAST ======================= -->
  <div id="toast" class="hidden"></div>

  <!-- ======================= DISCOVERY OVERLAY ======================= -->
  <div id="discovery-overlay" class="overlay hidden">
    <div class="discovery-panel">
      <div class="discovery-kicker">DETROIT DISCOVERY</div>
      <h1 id="discovery-title">LANDMARK NAME</h1>
      <div id="discovery-meta"></div>
      <div id="discovery-body"></div>
      <div id="discovery-personal" class="personal-connection hidden">
        <div class="personal-kicker">PERSONAL CONNECTION</div>
        <p id="discovery-personal-text"></p>
      </div>
      <div id="discovery-reward" class="discovery-reward"></div>
      <button id="discovery-continue" class="primary-btn">CONTINUE DRIVE</button>
    </div>
  </div>

  <!-- ======================= STORE OVERLAY ======================= -->
  <div id="store-overlay" class="overlay hidden">
    <div class="discovery-panel store-panel">
      <div class="discovery-kicker">SHOP</div>
      <h1 id="store-title">STORE NAME</h1>
      <div id="store-meta"></div>
      <div class="store-coins-row">YOUR COINS: <span id="store-coins">0</span> 🪙</div>
      <ul id="store-item-list"><!-- populated by StoreSystem --></ul>
      <button id="store-continue" class="primary-btn">CONTINUE DRIVE</button>
    </div>
  </div>

  <!-- ======================= RADIO PANEL ======================= -->
  <div id="radio-panel" class="panel hidden radio-panel-v2">
    <div class="radio-header">
      <h2>📻 RADIO</h2>
      <button id="radio-mute-btn" class="radio-mute-btn" aria-label="Mute radio" aria-pressed="false">🔊 MUTE</button>
    </div>
    <div class="radio-dial">
      <div class="radio-station-row">
        <span class="radio-live-dot"></span>
        <div id="radio-station-name" class="radio-station-name">LOADING…</div>
      </div>
      <div id="radio-now-playing" class="radio-now-playing"></div>
      <div id="radio-status" class="radio-status">Signal ready.</div>
    </div>
    <div class="radio-controls">
      <button id="radio-play-btn" class="radio-btn radio-btn-primary">▶ TUNE IN</button>
      <button id="radio-next-btn" class="radio-btn">⏭ NEXT TRACK</button>
    </div>
    <button class="close-btn" data-close="radio-panel">CLOSE</button>
  </div>
  <button id="radio-toggle" aria-label="Open radio">📻</button>

  <!-- ======================= PERFORMANCE INTRO OVERLAY ======================= -->
  <div id="performance-overlay" class="overlay hidden">
    <div class="discovery-panel performance-panel">
      <div class="discovery-kicker" id="performance-location">HART PLAZA</div>
      <div class="genre-badge" id="performance-genre">ROCK</div>
      <h1>LIVE PERFORMANCE</h1>
      <p id="performance-song"></p>
      <p id="performance-copy">Detroit is listening. Hit the notes as they reach the line.</p>
      <button id="performance-btn" class="primary-btn">START PERFORMANCE</button>
    </div>
  </div>

  <!-- ======================= QTE CONCERT OVERLAY ======================= -->
  <div id="qte-overlay" class="hidden">
    <div id="qte-topbar">
      <div id="qte-song-title"></div>
      <div id="qte-score">SCORE <span id="qte-score-val">0</span></div>
      <div id="qte-combo">COMBO <span id="qte-combo-val">0</span></div>
    </div>
    <div id="qte-judgment"></div>
    <div id="qte-lanes"><!-- 4 lanes injected by PerformanceSystem --></div>
    <div id="qte-hitline"></div>
  </div>

  <!-- ======================= PERFORMANCE RESULTS ======================= -->
  <div id="results-overlay" class="overlay hidden">
    <div class="discovery-panel results-panel">
      <div class="discovery-kicker">PERFORMANCE COMPLETE</div>
      <h1 id="results-rating">GREAT SHOW</h1>
      <div id="results-breakdown"></div>
      <div id="results-credits"></div>
      <button id="results-continue" class="primary-btn">CONTINUE</button>
    </div>
  </div>

  <!-- ======================= MOBILE TOUCH CONTROLS (driving) ======================= -->
  <div id="touch-controls">
    <div class="touch-cluster left">
      <div id="steering-wheel-wrapper" role="slider" aria-label="Steering wheel" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
        <svg id="steering-wheel" viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="86" fill="#0d1117aa" stroke="#ffffff22" stroke-width="2"/>
          <circle cx="100" cy="100" r="82" fill="none" stroke="#ffffff33" stroke-width="14"/>
          <circle cx="100" cy="100" r="82" fill="none" stroke="#d9a44177" stroke-width="2"/>
          <line x1="100" y1="100" x2="100" y2="24" stroke="#ffffff55" stroke-width="9" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="34" y2="138" stroke="#ffffff55" stroke-width="9" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="166" y2="138" stroke="#ffffff55" stroke-width="9" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="24" fill="#14171c" stroke="#d9a441" stroke-width="2"/>
          <circle cx="100" cy="28" r="6" fill="#d9a441"/>
        </svg>
      </div>
    </div>
    <div class="touch-cluster right">
      <button id="btn-brake" class="touch-btn brake" aria-label="Brake / Reverse">▼</button>
      <button id="btn-accel" class="touch-btn accel" aria-label="Accelerate">▲</button>
    </div>
  </div>

  <!-- ======================= QTE TOUCH LANES ======================= -->
  <div id="qte-touch-lanes" class="hidden">
    <button class="qte-touch-btn" data-lane="0"></button>
    <button class="qte-touch-btn" data-lane="1"></button>
    <button class="qte-touch-btn" data-lane="2"></button>
    <button class="qte-touch-btn" data-lane="3"></button>
  </div>

  <!-- ======================= LOADING SCREEN ======================= -->
  <div id="loading-screen">
    <div class="loading-title">WHAT UP DOE MY BABY</div>
    <div class="loading-sub">Time To Spin The Block</div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="woodward-detroit.js?v=2"></script>
</body>
</html>
